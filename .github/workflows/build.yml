name: Build

# Builds the solution (frontend included) and runs the tests that need neither GTA V nor the key files.
# The decoder regression tests skip themselves when the locally generated fixture is absent.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  library-tests:
    name: Preview library regression tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/EmotePreviewer.Web/package-lock.json
      - name: Install frontend dependencies
        working-directory: src/EmotePreviewer.Web
        run: npm ci
      - name: Run frontend library and animation regression tests
        working-directory: src/EmotePreviewer.Web
        run: npm test
      - name: Typecheck and bundle frontend
        working-directory: src/EmotePreviewer.Web
        run: npm run build

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/EmotePreviewer.Web/package-lock.json

      - name: Frontend typecheck and production bundle
        working-directory: src/EmotePreviewer.Web
        run: |
          npm ci
          npm run build
          npm test

      - name: Build
        run: dotnet build EmotePreviewer.slnx -c Release

      - name: Test
        run: dotnet test EmotePreviewer.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish (self-contained, single file)
        run: dotnet publish src/EmotePreviewer.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:SkipWebBuild=true -o out/publish

      - name: Verify published Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path "out/publish/EmotePreviewer.exe")) { throw "Missing published executable" }
          $exe = Get-Item "out/publish/EmotePreviewer.exe"
          if ($exe.Length -le 0) { throw "Published executable is empty" }
          Write-Host "Verified Windows executable: $($exe.Length) bytes"

      - name: Verify bundled UI and prepare Windows distribution
        shell: pwsh
        run: |
          $exe = Resolve-Path "out/publish/EmotePreviewer.exe"
          $distribution = "out/distribution"
          New-Item -ItemType Directory -Force -Path $distribution | Out-Null
          Copy-Item $exe "$distribution/EmotePreviewer.exe"
          if (!(Test-Path "src/EmotePreviewer.Web/dist/index.html")) { throw "Frontend bundle missing before distribution" }
          @(
            'PowerMoves Development - EmotePreviewer (Windows x64)',
            '1. Extract this ZIP to a folder on your Windows desktop.',
            '2. Double-click EmotePreviewer.exe.',
            '3. Set the GTA V Legacy game directory and required GTA key files in Settings.',
            '4. Select your emote resource/catalog and load the animation assets.',
            '5. Select an output folder, then use Batch Export to generate APNG previews.',
            '6. Copy the exported preview library to the separate PM Emotes resource.',
            'The application hosts its own local web UI and opens it in your browser.',
            'Keep the application running while using that UI. GTA game files and',
            'decryption keys are not bundled or distributed with this application.'
          ) | Set-Content "$distribution/START-HERE.txt" -Encoding UTF8
          $hash = (Get-FileHash "$distribution/EmotePreviewer.exe" -Algorithm SHA256).Hash
          "EmotePreviewer.exe SHA256: $hash" | Set-Content "$distribution/SHA256.txt" -Encoding ascii
          Compress-Archive -Path "$distribution/*" -DestinationPath "out/EmotePreviewer-win-x64.zip" -Force
          if ((Get-Item "out/EmotePreviewer-win-x64.zip").Length -le 0) { throw "Windows distribution ZIP is empty" }

      - uses: actions/upload-artifact@v4
        with:
          name: EmotePreviewer-win-x64
          path: out/EmotePreviewer-win-x64.zip
          if-no-files-found: error
          retention-days: 30
